# One-host setup: Laravel homepage at http://localhost/
# FossBilling client portal at http://localhost/client-area/
# Replace /var/www paths and PHP socket version for your machine.
server {
    listen 80;
    server_name localhost;
    root /var/www/quizontal-cloud/public;
    index index.php;

    # Always keep the slash so relative FossBilling links resolve under /client-area/.
    location = /client-area {
        return 301 /client-area/;
    }

    # Static files and front-controller routing for the FossBilling installation.
    # FOSSBILLING_DIR/src is the web root in the official stable archive.
    location /client-area/ {
        alias /var/www/fossbilling/src/;
        index index.php;
        try_files $uri $uri/ @fossbilling_front;
    }

    location @fossbilling_front {
        rewrite ^/client-area/(.*)$ /client-area/index.php?_url=/$1&$args last;
    }

    # This must be before the general Laravel PHP location.
    location ~ ^/client-area/(.+\.php)$ {
        alias /var/www/fossbilling/src/$1;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/fossbilling/src/$1;
        fastcgi_param SCRIPT_NAME /client-area/$1;
        fastcgi_param DOCUMENT_ROOT /var/www/fossbilling/src;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. { deny all; }
}
